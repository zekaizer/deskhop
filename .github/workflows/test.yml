name: Test

on:
  push:
    branches:
      - semi-ddm
  pull_request:
    branches:
      - semi-ddm
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install clang and llvm tools
        run: sudo apt-get install -y clang llvm

      - name: Configure (with coverage)
        run: cmake -S tests -B build-test -DCMAKE_C_COMPILER=clang -DCOVERAGE=ON

      - name: Build
        run: cmake --build build-test

      - name: Run tests
        working-directory: build-test
        run: ctest --output-on-failure
        env:
          LLVM_PROFILE_FILE: coverage-%p.profraw

      - name: Generate coverage report
        working-directory: build-test
        run: |
          llvm-profdata merge -sparse coverage-*.profraw -o coverage.profdata

          # Collect all test executables (exclude placeholder)
          BINS=$(find . -maxdepth 1 -executable -type f -name 'test_*' ! -name 'test_placeholder')

          if [ -z "$BINS" ]; then
            echo "No test binaries with source coverage found. Skipping."
            exit 0
          fi

          # Build -object flags for llvm-cov
          OBJ_FLAGS=""
          FIRST=""
          for bin in $BINS; do
            if [ -z "$FIRST" ]; then
              FIRST="$bin"
            else
              OBJ_FLAGS="$OBJ_FLAGS -object=$bin"
            fi
          done

          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          llvm-cov report $FIRST $OBJ_FLAGS \
            -instr-profile=coverage.profdata \
            -ignore-filename-regex='(unity|stubs)' | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
