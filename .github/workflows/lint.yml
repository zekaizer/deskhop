name: Lint

on:
  push:
    branches:
      - semi-ddm
  pull_request:
    branches:
      - semi-ddm
  workflow_dispatch:

jobs:
  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting (changed lines only)
        run: |
          DIFF=$(git clang-format --diff --extensions c,h origin/semi-ddm -- src/)
          if [ "$DIFF" != "no modified files to format" ] && [ "$DIFF" != "clang-format did not modify any files" ] && [ -n "$DIFF" ]; then
            echo "$DIFF"
            echo "::error::Changed code has formatting issues. Run: git clang-format --extensions c,h origin/semi-ddm"
            exit 1
          fi

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy clang

      - name: Build test target for compile_commands.json
        run: cmake -S tests -B build-test -DCMAKE_C_COMPILER=clang

      - name: Run clang-tidy on changed src/ files
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/semi-ddm -- 'src/*.c' 'src/*.h')
          if [ -z "$CHANGED" ]; then
            echo "No changed src/ files to analyze."
            exit 0
          fi
          echo "Analyzing: $CHANGED"
          clang-tidy -p build-test $CHANGED
